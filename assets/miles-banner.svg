<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Miles Morales themed banner for Ankit Rath">
  <defs>
    <style>
      @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: .75; } }
      .glow-anim { animation: pulse 4s ease-in-out infinite; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b10"/>
      <stop offset="55%" stop-color="#12101a"/>
      <stop offset="100%" stop-color="#2a0510"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="55%" r="80%">
      <stop offset="0%" stop-color="#ff2a33" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#e62429" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#e62429" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="3.6" fill="#ffffff" opacity="0.10"/>
      <circle cx="18.5" cy="18.5" r="5" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- base -->
  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>
  <rect width="1200" height="340" fill="url(#dots)" opacity="0.85"/>

  <!-- web strands from top-left -->
  <g stroke="#ffffff" stroke-opacity="0.16" fill="none" stroke-width="1.4">
    <path d="M0 0 H560"/>
    <path d="M0 0 L510 300"/>
    <path d="M0 0 L260 340"/>
    <path d="M0 0 L560 120"/>
    <path d="M0 340 Q140 300 300 340"/>
    <path d="M0 0 V340"/>
    <path d="M60 60 Q180 190 330 200 Q450 200 490 158"/>
    <path d="M120 120 Q240 250 380 252 Q450 240 470 206"/>
  </g>

  <!-- pulsing halo behind emblem -->
  <circle cx="900" cy="168" r="150" fill="url(#glow)" class="glow-anim" filter="url(#blur)"/>

  <!-- spider emblem -->
  <g fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round">
    <path d="M874 132 Q816 96 792 58"/>
    <path d="M884 116 Q834 50 850 18"/>
    <path d="M928 116 Q978 50 962 18"/>
    <path d="M928 132 Q988 96 1012 58"/>
    <path d="M872 174 Q808 174 778 200"/>
    <path d="M882 194 Q838 226 838 254"/>
    <path d="M928 174 Q1004 174 1034 200"/>
    <path d="M928 194 Q972 226 972 254"/>
  </g>
  <ellipse cx="900" cy="176" rx="48" ry="44" fill="#ffffff"/>
  <circle cx="900" cy="124" r="30" fill="#ffffff"/>
  <path d="M889 132 l7 12 -15 8 z" fill="#0b0b10"/>
  <path d="M911 132 l-7 12 15 8 z" fill="#0b0b10"/>

  <!-- text -->
  <g fill="#ffffff">
    <text x="120" y="86" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" letter-spacing="8" fill="#ff9a9d" font-weight="bold">PROWLER OF CODE</text>
    <rect x="120" y="108" width="104" height="9" fill="#e62429"/>
    <text x="118" y="176" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="86" font-weight="900" letter-spacing="5">ANKIT RATH</text>
    <text x="120" y="216" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-style="italic" letter-spacing="2" fill="#ffd0d2">
      swinging through the code-verse &#183; AI &#183; ML &#183; CV
    </text>
  </g>

  <!-- bottom divider line -->
  <path d="M0 332 Q300 322 600 332 Q900 342 1200 332" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
</svg>