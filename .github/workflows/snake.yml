name: generate-snake-game

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: generate-snake-game-from-github-contribution-grid
        id: generate-snake
        uses: Platane/snk@v3
        with:
          github_user_name: Ankittian
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/snake-crimson-dark.svg?color_snake=#ff3445&color_dots=#1f0a0c,#4a0408,#8e0a12,#b3111c,#ff3445
            dist/snake-crimson-light.svg?color_snake=#b3111c&color_dots=#f3e6e7,#e8a3a8,#d2545e,#b3111c,#6e050c
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}